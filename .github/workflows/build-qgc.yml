name: Build Custom QGC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake ninja-build build-essential git python3 python3-pip \
            libxcb-cursor0 \
            libgl1-mesa-dev libpulse-dev libudev-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - name: Install Qt 6.10.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtcharts qtlocation qtmultimedia qtpositioning qtquick3d qtspeech qt5compat qtserialport'

      - name: Show Qt path
        run: echo "QT_ROOT_DIR=$QT_ROOT_DIR"

      - name: Configure
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: build
          if-no-files-found: error

  build-windows:
    name: Windows Build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt 6.10.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts qtlocation qtmultimedia qtpositioning qtquick3d qtspeech qt5compat qtserialport'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show Qt path
        shell: pwsh
        run: echo "QT_ROOT_DIR=$env:QT_ROOT_DIR"

      - name: Configure
        shell: pwsh
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: build
          if-no-files-found: error
