name: Build Custom QGC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-22.04

    env:
      QT_VERSION: 6.10.1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake ninja-build build-essential git \
            libxcb-cursor0 \
            libgl1-mesa-dev libpulse-dev libudev-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install future requests jinja2

      - name: Install Qt 6.10.1 (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtcharts qthttpserver qtwebsockets

      - name: Configure
        run: |
          qt-cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build
          if-no-files-found: error

  build-windows:
    name: Windows Build
    runs-on: windows-2022

    env:
      QT_VERSION: 6.10.1
      QT_DIR: ${{ github.workspace }}\Qt

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall future requests jinja2

      - name: Install Qt 6.10.1 (Windows)
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 `
            -O "$env:QT_DIR" `
            -m qtcharts qthttpserver qtwebsockets

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_DIR%\%QT_VERSION%\msvc2022_64"

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release --parallel

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build
          if-no-files-found: error
